<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Roadster Runner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hud">
      <div class="brand">ROADSTER RUNNER</div>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
        <span>Speed: <strong id="speed">1.0x</strong></span>
      </div>
    </div>

    <div id="startScreen" class="screen visible">
      <div class="panel">
        <h1>TESLA ROADSTER</h1>
        <p>Blast through the starlight highway and dodge the incoming traffic.</p>
        <div class="controls">
          <span>Move: A / D or ← / →</span>
          <span>Boost: Space</span>
          <span>Restart: R</span>
        </div>
        <button id="startBtn">Start Race</button>
      </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <div class="panel small">
        <h2>Run Over</h2>
        <p id="finalScore">Score: 0</p>
        <button id="restartBtn">Race Again</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <script src="game.js"></script>
  </body>
</html>
